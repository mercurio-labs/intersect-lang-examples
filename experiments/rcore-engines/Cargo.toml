[package]
name = "rcore-engine-feasibility"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
autotests = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Match Text's Model revision so both adapters share the same model types.
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "11c33990a50cb4074d4f97619687a6b33358e560" }
intersect-run = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "2b1ecebbb49a14da5c6244a7796db77d50cc687f" }
intersect-run-catalog = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "d9c6677c1773a9b2ff9577ad2a74b326819c62eb" }
intersect-text = { git = "https://github.com/mercurio-labs/intersect-text.git", rev = "84feb230b8b6677f3f53c74eabda81a8e613f173" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }

[[test]]
name = "all"
path = "tests/all.rs"

[profile.dev]
debug = 0
