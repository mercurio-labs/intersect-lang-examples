[package]
name = "intersect-thermal-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
autotests = false
license = "MIT"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[test]]
name = "all"
path = "tests/all.rs"

[dependencies]
intersect-run = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "c88df67e640ca6d31b9276c992cc759e541fb22d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
intersect-model = { git = "https://github.com/mercurio-labs/intersect-model.git", rev = "c88df67e640ca6d31b9276c992cc759e541fb22d" }
