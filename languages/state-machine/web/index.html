<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f9">
  <title>State machine simulator · Intersect</title>
  <script type="module" src="./main.ts"></script>
</head>
<body>
  <header class="masthead">
    <div>
      <p class="product">Intersect Run</p>
      <h1>State machine simulator</h1>
    </div>
    <a href="#trace">Execution trace</a>
  </header>
  <main class="workbench">
    <section class="panel diagram-panel" aria-labelledby="diagram-title">
      <div class="panel-heading">
        <div><p class="eyebrow">Machine</p><h2 id="diagram-title">Airlock</h2></div>
        <p id="active-state" class="active-state" aria-live="polite">Loading…</p>
      </div>
      <div id="diagram"></div>
      <p class="legend"><span></span> Active state <span></span> Fired transition</p>
    </section>
    <section class="panel controls" aria-labelledby="run-title">
      <div class="panel-heading"><h2 id="run-title">Execution</h2><span id="step-count">Step 0</span></div>
      <div class="actions">
        <button id="step" type="button" class="primary" disabled>Step</button>
        <button id="play" type="button" disabled>Play</button>
        <button id="reset" type="button" disabled>Reset</button>
      </div>
      <div class="control-group">
        <label for="scenario">Scenario events</label>
        <textarea id="scenario" rows="3" spellcheck="false"></textarea>
        <p class="hint">Separate events with commas or new lines.</p>
      </div>
      <form id="send-form" class="control-group">
        <label for="event">Send an event</label>
        <div class="send-event"><select id="event" disabled></select><button id="send" disabled>Send</button></div>
      </form>
      <p id="run-status" role="status">Loading execution engine…</p>
    </section>
    <section class="panel source-panel" aria-labelledby="source-title">
      <div class="panel-heading"><h2 id="source-title">Model source</h2><button id="compile">Load model</button></div>
      <div class="source-body">
        <textarea id="source" aria-label="Machine source" spellcheck="false"></textarea>
        <p id="source-status" role="status">Checking source…</p>
      </div>
    </section>
    <section class="panel trace-panel" id="trace" aria-labelledby="trace-title">
      <div class="panel-heading"><h2 id="trace-title">Execution trace</h2><button id="download" disabled>Download trace</button></div>
      <ol id="history" aria-label="Trace steps"></ol>
    </section>
  </main>
</body>
</html>
