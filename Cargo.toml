[workspace]
members = ["support", "languages/catalog", "languages/petri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# All core crates use the same revision. See "Working with a local core" in README.md.
intersect-model = { git = "https://github.com/mercurio-labs/intersect", rev = "ee380404832746031e326062646e2b6ef1baeaea" }
intersect-xtext = { git = "https://github.com/mercurio-labs/intersect", rev = "ee380404832746031e326062646e2b6ef1baeaea" }
intersect-run = { git = "https://github.com/mercurio-labs/intersect", rev = "ee380404832746031e326062646e2b6ef1baeaea" }
examples-support = { path = "support" }
examples-catalog = { path = "languages/catalog" }

[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3
