[workspace]
members = ["support", "languages/catalog", "languages/petri", "languages/library", "runner"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# All core crates use the same revision. See "Working with a local core" in README.md.
intersect-model = { git = "https://github.com/mercurio-labs/intersect", rev = "084220f6012478ab35a54bb5397166a5f9150b0d" }
intersect-xtext = { git = "https://github.com/mercurio-labs/intersect", rev = "084220f6012478ab35a54bb5397166a5f9150b0d" }
intersect-run = { git = "https://github.com/mercurio-labs/intersect", rev = "084220f6012478ab35a54bb5397166a5f9150b0d" }
examples-support = { path = "support" }
examples-catalog = { path = "languages/catalog" }
examples-petri = { path = "languages/petri" }
examples-library = { path = "languages/library" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = 0
incremental = true

[profile.test-fast.package."*"]
opt-level = 3
