<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch simulator · Intersect</title><style>:root{color-scheme:dark;font:17px/1.6 system-ui;background:#0e1722;color:#e8eef4}body{margin:0}main{max-width:1040px;margin:auto;padding:40px 24px}a{color:#68e0bd}h1{font-size:clamp(32px,5vw,54px);line-height:1.15}p{max-width:760px;color:#b8c8d8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.card{background:#152333;border:1px solid #33475b;border-radius:12px;padding:24px}.button{display:inline-block;background:#68e0bd;color:#10261f;padding:12px 18px;border-radius:6px;text-decoration:none;font-weight:600}li{margin:12px 0}textarea{width:100%;min-height:260px;background:#101c29;color:#e8eef4;font:14px/1.7 monospace}button,select{font:inherit;padding:8px}table{width:100%;text-align:left}td{padding:8px;border-bottom:1px solid #33475b}.selected{background:#235748} [hidden]{display:none!important} .state{padding:18px;border:2px solid #33475b;border-radius:50px;display:inline-block;margin:10px}.state.active{border-color:#68e0bd;background:#235748}output{font-size:40px;font-variant-numeric:tabular-nums}input[type=range]{width:100%}</style><main><a href="examples/stopwatch/">← Stopwatch guide</a><h1>Stopwatch simulator</h1><p>Text supplies commands. Rcore decides state transitions. Intersect Run schedules logical milliseconds. Replay the recorded observations below.</p><div class="cards"><label>Commands<textarea id="script" spellcheck="false"></textarea></label><details><summary>Rcore state machine source</summary><pre id="rcore" style="white-space:pre-wrap"></pre></details></div><p><button id="run" disabled>Run commands</button> <button id="reset" disabled>Restore sample</button> <button id="download" disabled>Download trace</button></p><p id="status" role="status">Loading WebAssembly…</p><div id="machine" aria-label="Stopwatch state machine"></div><p><output id="elapsed">0 ms</output> <span id="clock">simulation: 0 ms</span></p><p><button id="play" disabled>Play replay</button> <button id="step" disabled>Step</button><label>Recorded observation<input id="position" type="range" min="0" max="0" value="0" disabled></label></p><p id="event"></p><details><summary>Transitions evaluated from Rcore</summary><ul id="transitions"></ul></details><ol id="events"></ol><script type="module" src="stopwatch.js"></script></main></html>
