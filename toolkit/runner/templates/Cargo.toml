[package]
name = "intersect-toolkit-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
default-run = "run-model"

[workspace]

[dependencies]
intersect-model = "=0.1.0-alpha.2"
intersect-text = "=0.1.0-alpha.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "run-model"
path = "src/main.rs"
