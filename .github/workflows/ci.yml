name: CI
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Verify examples with the pinned core
        env:
          LC_ALL: C
          INTERSECT_CORE_TOKEN: ${{ secrets.INTERSECT_CORE_TOKEN }}
        run: |
          export GIT_ASKPASS="$RUNNER_TEMP/intersect-askpass"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$INTERSECT_CORE_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          cargo clippy --locked --all-targets -p examples-support -p examples-catalog -p examples-petri -p examples-library -p examples-run -p examples-web -p examples-stopwatch -- -D warnings
          python -B tools/test_report.py run -- --profile test-fast -p examples-support -p examples-catalog -p examples-petri -p examples-library -p examples-run -p examples-web -p examples-stopwatch --lib --bins --tests --locked
          cargo run --locked --profile test-fast -p examples-petri --example petri_lifecycle
          cargo run --locked --profile test-fast -p examples-catalog --example catalog_lifecycle
          cargo run --locked --profile test-fast -p examples-library --example library_lifecycle
          cargo run --locked --profile test-fast -p examples-stopwatch --example stopwatch_lifecycle

  rcore-execution:
    name: Locked native and WebAssembly profile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/rcore-engines
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      GIT_TERMINAL_PROMPT: 0
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.15.1"
      - name: Install Rust and WebAssembly support
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch pinned dependencies
        run: cargo fetch --locked
      - name: Check formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Run profile tests
        run: python -B ../../tools/test_report.py run -- --locked --test all
      - name: Build native host
        run: cargo build --locked --release
      - name: Build WebAssembly host
        env:
          RUSTFLAGS: "-C link-arg=-zstack-size=4194304"
        run: cargo build --locked --release --lib --target wasm32-unknown-unknown
      - name: Compare native and WebAssembly traces
        run: |
          node tools/wasm-parity.mjs target/wasm32-unknown-unknown/release/rcore_engine_feasibility.wasm target/release/rcore-engine-feasibility
          node tools/package-parity.mjs target/wasm32-unknown-unknown/release/rcore_engine_feasibility.wasm target/release/rcore-engine-feasibility
